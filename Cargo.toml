[package]
name = "game_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.29"
egui_glow = "0.29"

tts = "0.26"

egui_window_glfw_passthrough = "0.9.0"
glow = "0.14.0"
glfw = { package = "glfw-passthrough", version = "0.55.0" }

tracing = "0.1"
tracing-subscriber = "0.3"

global-hotkey = "0.6"

image = "0.25"
xcap = "0.0.9"

# Versão ultra-leve da API do Windows apenas para as funções de vídeo
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",          # Ativa o tipo BOOL usado pelas funções de vídeo
    "Win32_UI_Magnification",    # Ativa o MagInitialize e efeitos de daltonismo
    "Win32_UI_WindowsAndMessaging",
] }

windows = { version = "0.52.0", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Security_Cryptography",
    "Globalization",
    "Foundation",
    "Storage_Streams",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"